[project]
name = "lean-refactor-arena"
version = "0.1.0"
description = "Harness that lets LLM agents shorten Lean 4 proofs for the Lean Refactor Arena"
requires-python = ">=3.13"
dependencies = [
    "cyclopts>=4",
    "rich>=14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["vendor", "workspaces", "runs", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PERF", "RUF"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["vendor", "workspaces", "runs", "research"]
