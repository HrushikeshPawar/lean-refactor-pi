[project]
name = "lean-refactor-arena"
version = "0.1.0"
description = "Harness that lets LLM agents shorten Lean 4 proofs for the Lean Refactor Arena"
requires-python = ">=3.13"
dependencies = [
    "cyclopts>=4",
    "rich>=14",
]

[project.scripts]
arena = "arena.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package stays at arena/ because code finds benchmark/ and vendor/ via Path(__file__).parents.
module-name = "arena"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["vendor", "workspaces", "runs", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PERF", "RUF"]
# RUF001-003: Lean statements and goals use ×, α, ℝ, ι on purpose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["vendor", "workspaces", "runs", "research"]
