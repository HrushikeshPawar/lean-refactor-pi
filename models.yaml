# Central model configuration: the one place for per-model facts. Edit here, not in code.
# arena run loads this file (arena/models.py), selects the real Pi provider/model below
# and hands the output ceiling to the Pi extension. Subset of YAML only: nested maps, [a, b] lists,
# {k: v} maps, # comments. Prices are USD per 1M tokens as OpenCode Go bills them; Pi prices each call
# from its own catalog and the run's spend is the sum of those actual costs.

provider: opencode-go          # default provider: a Pi catalog provider (Pi prices its models from its own catalog)
provider_timeout_ms: 120000    # a silent request is cut after this; Pi's own default is 300 s
outage_limit_ms: 600000
stream_idle_s: 600             # a request whose assistant message has not grown this long is aborted (buffering providers send nothing for minutes; proxy keepalives do not count)
retry: {max_retries: 3, base_delay_ms: 2000, max_delay_ms: 60000}

thinking:
  default: high                # reasoning level when --thinking is not given
  levels: [off, minimal, low, medium, high, xhigh, max]

# Providers Pi ships with its own login (OAuth), selectable per model without registration.
builtin_providers: [openai]

# Providers Pi does not ship. The Arena extension registers each one with Pi at start, with the models below that
# name it; Pi then prices their calls from the `price` given here. The key is read from the named environment
# variable (`arena run` loads .env).
providers:
  primalabs:
    base_url: https://api.primalabs.ai/v1
    api: openai-completions
    api_key_env: PL_API_KEY
  # OpenRouter with each model pinned to one endpoint via compat.open_router_routing (Pi sends it as the request's
  # `provider` field; Pi detects OpenRouter from the base URL).
  openrouter-pin:
    base_url: https://openrouter.ai/api/v1
    api: openai-completions
    api_key_env: OPENROUTER_API_KEY

# Campaign presets: run_campaign.py --preset <name>. Explicit flags override them.
presets:
  v6-matrix:
    rows: [Core.InitsUpdatesComm, "fundamental_theorem_of_variational_calculus'"]
    models: [deepseek-v4.1-flash]
    replicates: 3
    cap: 0.5
    jobs: 3

# Order here is the order of --model choices and of `arena_preflight` runs.
models:
  deepseek-v4.1-flash:         # OpenAI chat completions on opencode-go (Pi 1.2.0 catalog)
    # Automatic caching: cache writes are free and not reported (cache_write 0 is expected).
    price: {input: 0.15, output: 0.60, cache_read: 0.003, cache_write: 0}
    context_window: 1000000
    max_tokens: 384000
    request_output_tokens: 64000   # 16K, then 32K, were hit by high thinking (v6cov time_deriv: 4 turns); a 64K turn costs ~$0.038
    # OpenCode Go bills this model at 2x the price above during these UTC windows (weekdays only; weekends are off-peak).
    # Source: OpenCode Go docs (opencode.ai/docs/go), checked 2026-10-23. Each call's cost is scaled at settlement, and
    # `arena run` refuses to start or stops a run in a window unless --allow-peak is given.
    peak: {multiplier: 2, weekdays: [mon, tue, wed, thu, fri], utc: ["01:00-04:00", "06:00-10:00"]}
    compaction:
      # Measured over 4 runs: a compaction costs $0.055-0.075 (the summary request goes out uncached at
      # 350-400K tokens, plus a cold turn after it) and saves only ~$0.015 of cache reads afterwards
      # (cache read is $0.003/M), so compact as late as the window allows.
      # Pi (1.0.4) compacts when context > window - reserveTokens, with reserveTokens = window - at_tokens
      # (arena run). It also caps the summary output at 0.8 * reserveTokens = 120K here.
      # Headroom at 850K: the check runs after a turn, so the context can overshoot by one turn's tool
      # results (~25K at the measured ~2.85-2.9 bytes/token); summary request = context + prompt + summary
      # output <= 850K + 25K + 120K cap = 995K < 1M (typical summaries are ~10K); a normal 64K output
      # turn needs 850K + 25K + 64K = 939K < 1M.
      at_tokens: 850000
      keep_recent_tokens: 40000

  gpt-6.1-sol:                 # OpenAI Responses API via Pi's built-in openai provider (ChatGPT/Codex OAuth login)
    provider: openai
    # Pi catalog list prices; the subscription is not billed per token, but the run's spend is counted at list
    # price so its limit and results compare with paid runs. Prompts above 272K tokens cost 2x (catalog tier).
    price: {input: 2.0, output: 10.0, cache_read: 0.1, cache_write: 2.5}
    context_window: 272000
    max_tokens: 128000
    request_output_tokens: 32000
    compaction:
      # Window 272K: compaction at 200K leaves room for one turn's results (~25K) and a 32K output turn.
      at_tokens: 200000
      keep_recent_tokens: 40000

  gpt-6-luna:                  # OpenAI Responses API via Pi's built-in openai provider (ChatGPT/Codex OAuth login)
    provider: openai
    # Pi catalog list prices (openai provider); counted at list price like Sol. Prompts above 272K cost 2x.
    price: {input: 0.1, output: 0.5, cache_read: 0.01, cache_write: 0.125}
    context_window: 272000
    max_tokens: 128000
    request_output_tokens: 32000
    compaction:
      at_tokens: 200000
      keep_recent_tokens: 40000

  deepseek-v4.1-flash-or:      # DeepSeek V4.1 Flash (1017 snapshot) on OpenRouter, pinned to DeepSeek's own endpoint
    provider: openrouter-pin
    id: deepseek/deepseek-v4.1-flash-1017
    name: DeepSeek V4.1 Flash 1017 (DeepSeek via OpenRouter)
    reasoning: true
    # DeepSeek endpoint prices (OpenRouter list 2026-10-23), the same as opencode-go; no cache-write charge.
    # The endpoint may train on inputs: it needs the account's paid-training privacy setting on.
    price: {input: 0.15, output: 0.60, cache_read: 0.003, cache_write: 0}
    context_window: 1048576
    max_tokens: 393216         # the DeepSeek endpoint's max completion
    request_output_tokens: 64000
    compat: {open_router_routing: {only: [deepseek]}}
    compaction:
      # As deepseek-v4.1-flash: cache read is $0.003/M, so compact as late as the window allows.
      at_tokens: 850000
      keep_recent_tokens: 40000

  glm-5.3-flash:               # GLM-5.3-Flash on OpenRouter, pinned to the Z.AI endpoint (fp8)
    provider: openrouter-pin
    id: z-ai/glm-5.3-flash
    name: GLM-5.3-Flash (Z.AI via OpenRouter)
    reasoning: true
    # Z.AI endpoint prices (OpenRouter list 2026-10-23); no cache-write charge.
    price: {input: 0.15, output: 0.50, cache_read: 0.03, cache_write: 0}
    context_window: 1048576
    max_tokens: 131072         # the Z.AI endpoint's max completion
    request_output_tokens: 64000
    compat: {open_router_routing: {only: [z-ai]}}
    compaction:
      # Cache read is $0.03/M, 5x cheaper than uncached input, so compact late, as for DeepSeek.
      at_tokens: 850000
      keep_recent_tokens: 40000

  mimo-v2.6-pro:               # OpenAI chat completions on primalabs; probed 2026-10-10 (plan §9a)
    provider: primalabs
    id: primalabs-ai/MiMo-V2.6-Pro
    name: MiMo V2.6 Pro (PrimaLabs)
    reasoning: true
    tool_turn_reasoning_effort: high # v7solo-ski4: with none, 647 of 652 turns had no reasoning and one fill repeated 344 times
    # primalab dashboard prices (authoritative over its docs table); no cache-write charge.
    price: {input: 0.43, output: 0.87, cache_read: 0.0036, cache_write: 0}
    context_window: 1048576
    max_tokens: 131072         # not published; Pi's catalog value
    request_output_tokens: 64000
    compat: {supports_store: false, supports_developer_role: false, max_tokens_field: max_tokens, requires_reasoning_content_on_assistant_messages: true, thinking_format: openai}
    compaction:
      # Uncached input is 120x the cache-read price, so a summary request at 850K costs ~$0.37, most of a
      # $0.50 run, while a cached 850K turn costs ~$0.003: compact only when the window forces it.
      at_tokens: 900000
      keep_recent_tokens: 40000
