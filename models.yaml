# Central model configuration: the one place for per-model facts. Edit here, not in code.
# tools/run_pi_budgeted.py loads this file (arena/models.py), selects the real Pi provider/model below
# and hands the output ceiling to the Pi extension. Subset of YAML only: nested maps, [a, b] lists,
# {k: v} maps, # comments. Prices are USD per 1M tokens as OpenCode Go bills them; Pi prices each call
# from its own catalog and the run's spend is the sum of those actual costs.

provider: opencode-go          # Pi catalog provider that serves and bills every model below
provider_timeout_ms: 120000    # a silent request is cut after this; Pi's own default is 300 s

thinking:
  default: high                # reasoning level when --thinking is not given
  levels: [off, minimal, low, medium, high, xhigh, max]

# Campaign presets: run_campaign.py --preset <name>. Explicit flags override them.
presets:
  v6-matrix:
    rows: [Core.InitsUpdatesComm, "fundamental_theorem_of_variational_calculus'"]
    models: [deepseek-v4.1-flash]
    replicates: 3
    cap: 0.5
    jobs: 3

# Order here is the order of --model choices and of `arena_preflight` runs.
models:
  deepseek-v4.1-flash:         # Anthropic Messages API (max_tokens)
    # Automatic caching: cache writes are free and not reported (cache_write 0 is expected).
    price: {input: 0.15, output: 0.60, cache_read: 0.003, cache_write: 0}
    context_window: 1000000
    max_tokens: 384000
    request_output_tokens: 64000   # 16K, then 32K, were hit by high thinking (v6cov time_deriv: 4 turns); a 64K turn costs ~$0.038
    compaction:
      # Measured over 4 runs: a compaction costs $0.055-0.075 (the summary request goes out uncached at
      # 350-400K tokens, plus a cold turn after it) and saves only ~$0.015 of cache reads afterwards
      # (cache read is $0.003/M), so compact as late as the window allows.
      # Pi (1.0.4) compacts when context > window - reserveTokens, with reserveTokens = window - at_tokens
      # (tools/run_pi_budgeted.py). It also caps the summary output at 0.8 * reserveTokens = 120K here.
      # Headroom at 850K: the check runs after a turn, so the context can overshoot by one turn's tool
      # results (~25K at the measured ~2.85-2.9 bytes/token); summary request = context + prompt + summary
      # output <= 850K + 25K + 120K cap = 995K < 1M (typical summaries are ~10K); a normal 64K output
      # turn needs 850K + 25K + 64K = 939K < 1M.
      at_tokens: 850000
      keep_recent_tokens: 40000
