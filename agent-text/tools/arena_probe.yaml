description: "Compile one proof draft or one to {draft_limit_word} drafts on the primary toolchain. Each may be a complete theorem, a `by` proof body, or a `:=` proof body; the exact benchmark statement is supplied for proof bodies. `sorry` is allowed and each incomplete draft returns its actual hole goals and stable pN ID. Routes are fingerprinted from complete proofs that compile; drafts with `sorry` holes are not fingerprinted. A probe takes several drafts at once (two or three is typical). A complete compiling draft is automatically promoted to a candidate. `idea` (a one-line route title) creates an idea and links the attempt to it."
params:
  idea: "One-line route title; creates the idea and links this attempt to it"
