description: "Look up what the team already tried on a step: each distinct change, how often it was tried, its best measured effect in tokens and heartbeats, whether it was kept, won, failed or is a dead end, and the attempt ids. Send nothing to get the board: the run best's costliest steps with tokens and heartbeats, and per step the attempts, best gain, open hypotheses, dead ends, and which are untried; use it to pick where the remaining points are. Send node with step to look up that step, tactic to look up a tactic word, or both. The harness writes the log; it also sends you new bests, wins and dead ends in your context, so look up a step before you spend a compile on it."
params:
  node: "Node id. Send with step; default: your focus."
  step: "Step id such as s2, in that node's outline."
  tactic: "A tactic word to look up, such as the first word of a tactic line."
