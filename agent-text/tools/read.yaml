description: "Return pinned source or a node's prices, diff, outline, or graph map."
params:
  handle: "Declaration handle from search, e.g. decl:Nat.add_comm; append :first-last for file lines, e.g. decl:Nat.add_comm:12-30."
  node: "Node identifier for node views."
  hole: "Hole identifier for its goal view."
  view: "Choose source, prices, diff, outline, or map."
  against: "Comparison node for the diff view."
