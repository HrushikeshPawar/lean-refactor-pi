description: "Return reference cards for a proof step: short patterns that say when a change applies, how to make it, a before and after example, and which way it usually moves tokens and heartbeats. Send node with step to use a saved step, or text to use any snippet. Cards are ranked first by the code in the step that a card changes, then by the step's tactics and the constants in its goal, and a card you were shown before is not returned again; the reply says when nothing new matches. Each card is a pattern seen to lower the cost somewhere, not a promise; compile the change to check it."
params:
  node: "Node id. Send with step."
  step: "Step id such as s2, in that node's outline."
  text: "A proof snippet to match, instead of node and step."
  position: "Where the snippet sits in its proof: opening, middle or closing. Used with text; defaults to middle."
