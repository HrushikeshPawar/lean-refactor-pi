description: "Compile up to {compile_max_drafts} proof drafts or one graph edit: splice, fill, merge, or base. Return node status, diagnostics, goals, and measured prices."
params:
  drafts: "Proof texts to compile, with at most {compile_max_drafts} entries."
  splice: "Replace a range of steps in one base node."
  splice_base: "Node whose steps are replaced; omission uses the focus."
  splice_steps: "Inclusive step range, such as s2-s3."
  splice_text: "Proof text replacing the selected range."
  fill: "Replace one open hole with proof text."
  fill_hole: "Open hole identifier, such as n2.h1."
  fill_text: "Proof text for the hole."
  merge: "Copy selected steps into a base node."
  merge_base: "Node receiving steps; omission uses the focus."
  merge_take: "Source node and step pairs to copy."
  merge_from: "Node supplying this step."
  merge_step: "Identifier of the supplied step."
  base: "Node used as the draft base."
  from: "Claimed parent recorded for audit."
  note: "Optional text attached to the node."
  check: "Select token counting without Lean or a Lean compile."
