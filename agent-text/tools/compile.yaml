description: "Compile up to {compile_max_drafts} proof drafts, or apply one graph edit: splice, fill or merge. Returns for each node its id, outcome, errors, open holes with goals, and price. State the move and when of every call: the harness logs them for the other actors."
params:
  drafts: "Up to {compile_max_drafts} plain strings, each the whole theorem, `by` plus tactics, or tactic lines alone."
  splice: "Replace a range of steps in one node."
  splice_base: "Node whose steps are replaced; default: the focus."
  splice_steps: "Inclusive step range, for example s2-s3."
  splice_text: "Proof text that replaces the range."
  fill: "Replace one open hole with proof text."
  fill_hole: "Open hole id, for example n2.h1."
  fill_text: "Proof text for the hole."
  merge: "Copy selected steps into one node."
  merge_base: "Node that receives the steps; default: the focus."
  merge_take: "Pairs of source node and step."
  merge_from: "Node that supplies the step."
  merge_step: "Id of the supplied step."
  base: "Node the drafts are filed under; default base of a splice or merge."
  node: "Alias of base."
  from: "Parent node recorded with the result."
  move: "What this change does, in general words, at most {idea_field_chars} characters, no node ids. Written for an actor who cannot see your proof."
  when: "The goal shape or condition that makes the change apply, at most {idea_field_chars} characters. Written for an actor who cannot see your proof."
  check: "Valid values: tokens (count tokens only, no Lean) or lean (compile)."
