description: "Compile one to {compile_max_drafts} drafts or one structured edit and return measured results."
params:
  drafts: "Proof drafts to compile, with one to {compile_max_drafts} entries."
  splice: "Replace the selected steps of a base node with text."
  splice_base: "Base node; the current focus is used when omitted."
  splice_steps: "Step range to replace, such as s2-s3."
  splice_text: "Replacement text for the selected steps."
  fill: "Fill one hole in a sketch node."
  fill_hole: "Existing hole handle, such as n2.h1."
  fill_text: "Text to place in the hole."
  merge: "Take selected steps from other nodes."
  merge_base: "Base node; the current focus is used when omitted."
  merge_take: "Steps to copy from other nodes."
  merge_from: "Node that supplies the step."
  merge_step: "Step identifier to take."
  base: "Optional base node for drafts."
  from: "Named parent node for the audit record."
  note: "Short node note."
  check: "Check drafts with tokens only or with Lean."
