description: "Update your own card: the one current note the other actors read, with two fields, focus and asks. Send only the field that changed; an empty string clears a field. Results and ideas are not written here: the harness records every attempt with its measured effect in the attempt log. Keep each field short and write only what is new or still true: earlier versions keep the history, and readers see only the sentences that changed."
params:
  focus: "What you are working on now and why: your family, your hypothesis, or the trunk."
  asks: "What you need from the orchestrator or the others."
