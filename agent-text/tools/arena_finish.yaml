description: "Request to stop the run. A confirm is accepted once {finish_remaining_pct}% or less of the spend allowance remains. Before that, the call is refused with the amount spent and left, the routes tried and the current best's saving per score axis (compat, tokens, heartbeats). With {finish_remaining_pct}% or less left, the first call returns one factual review (with at most one reminder if the current idea has no proof attempt) and a second call after the decision turn confirms the stop; finishing is final for this run."
