description: "Give one hypothesis to a worker. A fresh job needs scope and an anchor. A follow-up sends task and job_id and keeps that job's anchor. A follow-up is accepted only after the job has settled; use await_results first."
params:
  task: "What the worker should do."
  scope: "Required for a fresh job; rejected on a follow-up. proof: the worker searches the whole proof from the node; at has node only. step: the worker edits one part of the node; at has node plus steps or hole."
  job_id: "Existing job to resume, such as job1. Omit when starting a fresh job."
  at: "Saved parent node; with scope step, also exactly one of steps or hole. Fresh jobs only."
  at_node: "Immutable parent proof node."
  at_steps: "Inclusive positions of top-level steps, counting from 1: [2,3] is s2 through s3."
  at_hole: "Open hole id of that node, such as n3.h1. Exclusive with steps."
