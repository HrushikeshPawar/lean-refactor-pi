description: "Give one hypothesis to a worker. A fresh job needs scope and an anchor. A follow-up sends task and job_id and keeps that job's anchor. A follow-up to a running job is delivered after its current step; a follow-up to a settled job resumes its session."
params:
  task: "What the worker should do, short, in plain sentences, citing log ids such as i12 where they apply. When writing compactly, join items with a hyphen and no spaces, never run numbers and units together, and write a change as saved or added rather than a sign, for example n160-352-tok-369-HB or n339-496-HB-saved."
  scope: "Required for a fresh job; rejected on a follow-up. proof: the worker searches the whole proof from the node; at has node only. step: the worker edits one part of the node; at has node plus steps or hole. island: the worker owns one distinct proof family for the rest of the run; at is optional (default: for objective tokens the run best when one exists, else the original proof, reference only) and has node only. trim: the worker keeps tightening the current run best for the rest of the run; omit at. merge: the worker combines closed nodes into one complete proof; at has nodes only, or omit it and the harness picks the run best and each other job's newest closed node. A merge job needs no free slot: it may use one extra slot, one merge at a time."
  objective: "Scope island only. tokens or heartbeats makes an axis island judged on that measure (a token island within its heartbeat ceiling); omit for a family island judged on score."
  job_id: "Existing job to message or resume, such as job1. Omit when starting a fresh job."
  at: "Saved parent node; with scope step, also exactly one of steps or hole. Fresh jobs only; optional for island. With scope merge, nodes only."
  at_node: "Immutable parent proof node."
  at_steps: "Inclusive positions of top-level steps, counting from 1: [2,3] is s2 through s3."
  at_hole: "Open hole id of that node, such as n3.h1. Exclusive with steps."
  at_nodes: "Two or more saved node ids to combine, such as [\"n3\", \"n9\"]; the first is the base."
