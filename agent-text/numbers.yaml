finish_remaining_pct: 10
original_candidate: 1
max_failures: 3
max_drafts: 4
compile_max_drafts: 4
error_passes_max: 3
error_message_chars: 400
cross_version_wait_seconds: 10
await_timeout_minutes: 10
goal_try_max: 6
goal_cases_max: 12
goal_try_chars: 1500
scratch_max_chars: 8000
scratch_message_chars: 3000
scratch_output_chars: 300
goal_hyp_chars: 1000
error_goals_max: 3
outline_max_chars: 6000
read_source_lines: 400
source_lines_per_call: 400
find_files_per_query: 30
search_hits_default: 10
search_hits_max: 30
search_fuzzy_hits: 5
search_signature_chars: 200
packet_max_chars: 40000
packet_goals: 40
packet_goal_chars: 700
packet_goal_floor: 8
packet_used: 5
packet_used_chars: 320
packet_earlier: 60
packet_earlier_budget: 12000
packet_earlier_chars: 240
packet_earlier_filler: 5
packet_types: 8
packet_type_chars: 700
packet_profile_lines: 12
packet_scope: 25
packet_scope_chars: 600
packet_library: 60
packet_library_budget: 7000
packet_library_chars: 340
memory_library_lines: 15
memory_read_entries: 30
memory_recovery_entries: 8
budget:
  static_words: 860
  # 870: the team paragraph adds Sol's default stance (keep hill climbing) and a per-role guide (r12b analysis).
  # 920: keep every slot busy, refill ended islands, no best is final, combine axis extremes (r14 stall analysis).
  # 1040: the plan paragraph (ordered steps, one reshape and one merge step, re-plan after each best) and merge jobs.
  # 1080: a merge job's extra slot and the measured-or-estimated wording of the plan paragraph.
  # 1110: the token island is judged within a heartbeat ceiling and harvested through a heartbeat island.
  packet_words: 1110
  # 215: the worker packet explains the card (what to write, what arrives in replies).
  # 240: read a definition's source before using it instead of reconstructing it (GLM trace analysis 2026-10-23).
  worker_words: 240
  reply_words: 60
  # Continuation nudges are sent only after a turn with no tool call, a few times a run.
  nudge_words: 60
  # The island packet section and its family lines exist only for island workers; they are not in the shared worker packet.
  # 135: the island packet explains the stay-open loop and the card.
  island_words: 135
# Steps below the step table are named when tried at most this often and still worth at least this many points.
# An island worker settles after this many consecutive full turns without improving its island best.
island_stale_turns: 4
# The island startup packet lists at most this many existing families, each with this many tactic lines.
island_families: 6
island_family_lines: 4
# The orchestrator is told about idle worker slots once the run is this many minutes old.
idle_note_after_minutes: 5
# While slots stay idle the note repeats this often; r14's orchestrator ignored a single note for 17 minutes.
idle_note_repeat_minutes: 5
untried_step_max_tries: 2
untried_step_min_pts: 0.5
# The orchestrator is told of a plateau when the run best gains less than plateau_points in plateau_minutes.
# 0.5 never fired in run r11 until its last 2 minutes: the best gained about 0.5 per 10 minutes from 1-3 token trims alone.
plateau_points: 1.0
plateau_minutes: 10
# A worker is reminded to update its card about its new best nodes at most once per this many minutes.
card_stale_minutes: 5
# The orchestrator's plan holds at most this many steps (see arena/plans.py).
plan_max_steps: 12
# A missing plan is said again after this many sol tool calls (see team_reply.notices).
notice_repeat_calls: 10
# A merge job ends after this many closed nodes of its own, or when its last merge_stale_compiles closed nodes all
# failed to beat the run best as it stood when each was saved.
merge_max_compiles: 8
merge_stale_compiles: 4
# A merge packet shows at most this many diff lines per node.
merge_diff_lines: 120
# A worker is told to test its drafts with compile after this many tool calls without a compile.
compile_nudge_calls: 4
# A token island's best counts only proofs whose heartbeats are at most this multiple of the run best's.
token_island_heartbeat_ceiling: 2
# The orchestrator's plan is stale when the run best's score rose by at least this many points since it was saved
# (or its route changed).
plan_stale_points: 3
# An open orchestrator ask shows at most this many characters of its text in the jobs view.
open_ask_chars: 80
# A worker node is announced as shorter (token_short) only when it saves at least this many tokens on the run best:
# smaller savings are the trim job's own variants.
token_short_min_saved: 10
# The token_short notice names this many of the shorter node's costliest steps.
token_short_steps: 3
