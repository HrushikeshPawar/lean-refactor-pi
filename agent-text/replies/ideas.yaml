# Lines of the attempt log that reach an actor (see arena/ideas.py). Parts of one line are joined with " - ".
best_head: "New best {node} ({score}) from {parent}"
technique_head: "Worked for another actor"
dead_head: "Dead end at {where}"
more: "+{count} more in the attempt log: look them up with the ideas tool."
where: "step {step} of {node}"
change: "`{old}` -> `{new}`"
change_tactics: "tactics `{old}` -> `{new}`"
effect_tok: "{value} tok"
effect_hb: "{value} HB"
effect_hb_proof: "{value} HB over the whole proof"
when: "applies when {when}"
fails: "failed {count} times and never gained"
error: "first error: {error}"
island: "{job} ({role}): best {best}"
island_best_score: "{node} {value}"
island_best_tokens: "{node} {value} tok"
island_best_heartbeats: "{node} {value} HB"
island_none: "no closed proof yet"
island_stale: "{count} attempts since its last gain"
stall: "Stalled: {count} attempts on step {step} of {node} without a gain, {dead} of them dead ends"
stall_next: "move to a different step; the costliest other steps of {node} are {steps}"
stall_step: "{step} ({tokens} tok, {heartbeats} HB)"
stall_sol: "{job}: {count} attempts on {step} of {node} without a gain"
stall_sol_next: "next costliest {steps}"
role_sol: "orchestrator"
role_trim: "trim"
role_merge: "merge"
role_tokens: "token island"
role_heartbeats: "heartbeat island"
role_family: "family island"
role_proof: "proof job"
role_step: "step job"
status_kept: "kept"
status_win: "won"
status_failed: "failed"
status_dead: "dead end"
status_pending: "pending"
harness_assembly: "merge of {sources}"
harness_salvage: "sketch of {source} with its failing part left open"
harness_other: "built by the harness from {source}"
query_head: "Tried on {target}:"
query_row: "{change} - tried {count} times - {status} - best {effect} - {ids}"
query_none: "Nothing is logged for that yet."
query_bad: "Send node with step (a step id such as s2), or tactic with a word to look up."
query_unknown: "Unknown node or step: {target}."
hyp_line: "{id} {job} ({task}): {tries}, {best}, in best: {kept} - {verdict}"
hyp_task: "{task}{expect}"
hyp_expect: ", expect {expect}"
hyp_try: "{count} try"
hyp_tries: "{count} tries"
hyp_best: "best {effect} on {step}"
hyp_best_proof: "best {effect}"
hyp_no_gain: "no gain"
hyp_kept_yes: "yes"
hyp_kept_no: "no"
verdict_confirmed: "confirmed"
verdict_partly: "partly"
verdict_refuted: "refuted"
verdict_open: "open"
hyp_noted: "Recorded as {id}."
board_head: "Steps of the run best {node}, costliest first:"
board_row: "{step} {tokens} tok {heartbeats} HB - {state}"
board_untried: "untried"
board_tried: "{count} tries, {best}"
board_open: ", open {ids}"
board_dead: ", {count} dead ends"
board_none: "No verified best proof is saved yet."
board_untried_step: "{step} {cost}"
board_untried_line: "Untried in {node}: {steps}"
