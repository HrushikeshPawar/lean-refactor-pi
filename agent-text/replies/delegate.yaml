task: "Give task: what the worker should do."
follow_up: "A follow-up sends only task and job_id; omit scope and at."
scope: "A fresh job needs scope proof or step and at with a saved node."
anchor_proof: "scope proof is the whole proof: send at with node only. For a step range use scope step with at node and steps [first, last], or hole."
anchor_step: "scope step needs at with node plus exactly one of steps [first, last] or hole."
node: "at.node must be a saved node id such as n3."
hole: "at.hole must be an open hole of that node, such as n3.h1."
steps: "at.steps must be [first,last] within the node's steps, counted from 1, first <= last."
active: "That job is starting or stopping and cannot read a message now; try again after await_results."
job: "Unknown job_id; jobs lists yours."
ownership: "That job belongs to another actor; jobs lists yours."
actor: "Only the lead actor may delegate."
identity: "The call had no usable identity or task; send task as a nonempty string."
recovering: "The run is recovering; try again after await_results."
