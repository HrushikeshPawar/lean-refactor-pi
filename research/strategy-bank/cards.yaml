# Generic Lean 4 proof-golfing strategy bank. See README.md.
cards:
  -
    id: "S01-obtain-to-projection"
    title: "Replace destructuring with projections"
    tags:
      - "obtain"
      - "rcases"
      - "cases"
      - "anonymous-constructor"
    goal_tags: []
    at: {}
    when: "A hypothesis of type A ∧ B, A ↔ B or ∃ is destructured, and each component is used once."
    how: "Use h.1 / h.2 / h.mp / h.mpr / h.left directly where the component is needed. For ∃, keep one obtain only if the witness is used several times."
    before: |-
      example (p q : Prop) (h : p ∧ q) : q ∧ p := by
        obtain ⟨hp, hq⟩ := h
        exact ⟨hq, hp⟩
    after: "example (p q : Prop) (h : p ∧ q) : q ∧ p := ⟨h.2, h.1⟩"
    effect:
      tokens: "down"
      heartbeats:
        opening: "unknown"
        middle: "up"
        closing: "unknown"
      confidence: "medium"
      note: "Heartbeat direction is the same at every position with data."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Stable across 4.25-4.33 as far as known."
    move_class: "obtain_to_projection"
    source: "both"
  -
    id: "S02-rintro-merge"
    title: "Merge intro with pattern matching"
    tags:
      - "intro"
      - "rintro"
      - "rcases"
    goal_tags: []
    at: {}
    when: "Goal starts with intro followed by rcases/obtain on the introduced hypothesis."
    how: "Use rintro with the pattern. rintro ⟨a, rfl⟩ also substitutes equalities on the spot."
    before: |-
      example (p q r : Prop) : p ∧ q → r ∨ p := by
        intro h
        obtain ⟨hp, _⟩ := h
        exact Or.inr hp
    after: |-
      example (p q r : Prop) : p ∧ q → r ∨ p := by
        rintro ⟨hp, -⟩
        exact .inr hp
    effect:
      tokens: "down"
      heartbeats:
        opening: "unknown"
        middle: "unknown"
        closing: "unknown"
      confidence: "low"
      note: "Too little mined evidence; measure with the profiler."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Stable across 4.25-4.33 as far as known."
    move_class: "rcases_to_rintro"
    source: "both"
  -
    id: "S03-inline-single-use-have"
    title: "Inline a single-use have into the term that uses it"
    tags:
      - "have"
      - "exact"
      - "by"
    goal_tags: []
    at: {}
    when: "have h : T := by tac, then exactly one later use as an argument."
    how: "Pass (by tac) in the argument position; the expected type is then known, so T is not written."
    before: |-
      example (a b : ℕ) (f : a < b → a ≤ b) (h0 : a + 1 ≤ b) : a ≤ b := by
        have h : a < b := by omega
        exact f h
    after: |-
      example (a b : ℕ) (f : a < b → a ≤ b) (h0 : a + 1 ≤ b) : a ≤ b :=
        f (by omega)
    effect:
      tokens: "down"
      heartbeats:
        opening: "unknown"
        middle: "down"
        closing: "down"
      confidence: "high"
      note: "Heartbeat direction is the same at every position with data."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Do not inline a have used 3 or more times; the term is then copied each time."
    move_class: "inline_have_into_term"
    source: "both"
  -
    id: "S04-inline-have-as-show-rw"
    title: "Turn a have used only by rw into an inline show"
    tags:
      - "have"
      - "rw"
      - "show"
    goal_tags: []
    at: {}
    when: "have h : a = b := by tac; rw [h] with no other use of h."
    how: "rw [show a = b by tac] (or from term). The statement can often be partly elided: show _ = b."
    before: |-
      example (x y : ℕ) (hy : y = 2 * x) : x + y = 3 * x := by
        have h : x + y = x + 2 * x := by rw [hy]
        rw [h]; ring
    after: |-
      example (x y : ℕ) (hy : y = 2 * x) : x + y = 3 * x := by
        rw [hy]; ring
    effect:
      tokens: "down"
      heartbeats:
        opening: "unknown"
        middle: "down"
        closing: "down"
      confidence: "medium"
      note: "Heartbeat direction is the same at every position with data."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Often the whole have dissolves once the hypothesis is rewritten directly; check whether the closing tactic works without it."
    move_class: "inline_have_show"
    source: "both"
  -
    id: "S05-merge-have-chain"
    title: "Collapse a chain of small haves"
    tags:
      - "have"
      - "omega"
    goal_tags: []
    at: {}
    when: "Several consecutive have lines each feed only the next one or the final close."
    how: "Fold them into the final call: pass them as terms, give them to simp/omega/linarith as arguments, or let a closer find them from context."
    before: |-
      example (a b c : ℤ) (h1 : a ≤ b) (h2 : b ≤ c) : a ≤ c + 1 := by
        have h3 : a ≤ c := le_trans h1 h2
        have h4 : c ≤ c + 1 := by omega
        exact le_trans h3 h4
    after: "example (a b c : ℤ) (h1 : a ≤ b) (h2 : b ≤ c) : a ≤ c + 1 := by omega"
    effect:
      tokens: "down"
      heartbeats:
        opening: "down"
        middle: "down"
        closing: "down"
      confidence: "high"
      note: "Heartbeat direction is the same at every position with data."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Stable across 4.25-4.33 as far as known."
    move_class: "drop_have_chain"
    source: "both"
  -
    id: "S06-drop-set-let"
    title: "Delete set / let / generalize abbreviations"
    tags:
      - "set"
      - "let"
      - "generalize"
    goal_tags: []
    at: {}
    when: "A local abbreviation is introduced to shorten text, but is used fewer than about three times."
    how: "Substitute the definition back, or delete the abbreviation if the closing tactic does not need it. Names count as one token, so an abbreviation only pays when it replaces a long expression used often."
    before: |-
      example (a b : ℕ) (h : a < b) : a + 1 ≤ b := by
        set d := b - a with hd
        omega
    after: "example (a b : ℕ) (h : a < b) : a + 1 ≤ b := by omega"
    effect:
      tokens: "down"
      heartbeats:
        opening: "up"
        middle: "down"
        closing: "mixed"
      confidence: "medium"
      note: "Heartbeat effect depends on where in the proof the edit sits; profile before deciding."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Stable across 4.25-4.33 as far as known."
    move_class: "drop_set_let"
    source: "both"
  -
    id: "S07-simp-to-simp-only"
    title: "Squeeze a bare simp for heartbeats"
    tags:
      - "simp"
      - "heartbeats"
    goal_tags:
      - "List.length"
      - "List.append"
    at: {}
    when: "A non-terminal simp or simp [..] is expensive (the profiler shows it) and runs on a big context."
    how: "Run simp? once, paste the simp only list. The list adds tokens but removes simp's search. Use when heartbeat weight dominates."
    before: |-
      example (xs ys : List ℕ) : (xs ++ ys).length = ys.length + xs.length := by
        simp [Nat.add_comm]
    after: |-
      example (xs ys : List ℕ) : (xs ++ ys).length = ys.length + xs.length := by
        simp only [List.length_append, Nat.add_comm]
    effect:
      tokens: "mixed"
      heartbeats:
        opening: "down"
        middle: "down"
        closing: "down"
      confidence: "high"
      note: "Heartbeat direction is the same at every position with data."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Lemma lists break on renames across Lean 4.25-4.33; keep a bare simp as fallback if versions matter more than heartbeats. 4.33 transparency change can stop listed lemmas from firing."
    move_class: "simp_to_simp_only"
    source: "both"
  -
    id: "S08-simp-only-to-simp"
    title: "Drop a simp only list when bare simp is as fast"
    tags:
      - "simp"
    goal_tags:
      - "List.length"
    at: {}
    when: "simp only [long list] where bare simp closes the goal; the list costs many tokens."
    how: "Try plain simp (or simp with one or two lemmas). Keep it only if heartbeats do not rise by more than the token gain is worth."
    before: |-
      example (xs : List ℕ) : (xs.map (· + 1)).length = xs.length := by
        simp only [List.length_map]
    after: "example (xs : List ℕ) : (xs.map (· + 1)).length = xs.length := by simp"
    effect:
      tokens: "down"
      heartbeats:
        opening: "mixed"
        middle: "mixed"
        closing: "down"
      confidence: "high"
      note: "Heartbeat effect depends on where in the proof the edit sits; profile before deciding."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Bare simp is the most version-stable form."
    move_class: "simp_only_to_simp"
    source: "both"
  -
    id: "S09-grind-closer"
    title: "Replace a multi-step arithmetic or case chain by grind"
    tags:
      - "grind"
    goal_tags: []
    at: {}
    when: "Goal after intros is first-order with equalities, linear arithmetic, or constructor injectivity; the manual proof is several lines."
    how: "Try grind, then grind only [lemmas] from grind? to bound cost. Tokens fall, but grind can cost much more search than the steps it replaces; check the profile before and after."
    before: |-
      example (a b : ℕ) (h : a = b + 1) (h2 : b > 3) : a > 4 ∧ a ≠ 0 := by
        constructor <;> omega
    after: "example (a b : ℕ) (h : a = b + 1) (h2 : b > 3) : a > 4 ∧ a ≠ 0 := by grind"
    effect:
      tokens: "down"
      heartbeats:
        opening: "unknown"
        middle: "up"
        closing: "mixed"
      confidence: "low"
      note: "Heartbeat effect depends on where in the proof the edit sits; profile before deciding."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "grind behaviour changed in 4.26 (cutsat to lia), 4.30 (canonicalizer), 4.32, 4.33; a bare grind can flip between versions. Fallback: first | omega | grind."
    move_class: "grind_replaces"
    source: "both"
  -
    id: "S10-grind-to-explicit"
    title: "Replace grind that is too slow or unstable"
    tags:
      - "grind"
      - "heartbeats"
    goal_tags:
      - "List.length"
    at: {}
    when: "grind closes a goal but costs many heartbeats or fails on another toolchain."
    how: "Read grind? output; use grind only [..] or replace with omega/simp_all/exact of the lemma it used."
    before: "example (xs : List ℕ) (h : xs = []) : xs.length = 0 := by grind"
    after: "example (xs : List ℕ) (h : xs = []) : xs.length = 0 := by simp [h]"
    effect:
      tokens: "mixed"
      heartbeats:
        opening: "unknown"
        middle: "unknown"
        closing: "down"
      confidence: "low"
      note: "Heartbeat direction is the same at every position with data."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Library names can change between versions; keep grind as the fallback if the explicit term breaks."
    move_class: "grind_removed"
    source: "both"
  -
    id: "S11-omega-for-arith"
    title: "Close linear Nat/Int goals with omega"
    tags:
      - "omega"
      - "arith"
    goal_tags: []
    at: {}
    when: "A chain of le_trans / add_lt_add / Nat.* lemma steps or calc over linear arithmetic with +, -, *const, /const, %const, min, max."
    how: "One omega. If context is large, clear unrelated hypotheses first, since omega reads all of them."
    before: |-
      example (n m : ℕ) (h : n < m) : n + 2 ≤ m + 1 := by
        have := Nat.succ_le_of_lt h
        exact Nat.succ_le_succ this
    after: "example (n m : ℕ) (h : n < m) : n + 2 ≤ m + 1 := by omega"
    effect:
      tokens: "up"
      heartbeats:
        opening: "unknown"
        middle: "unknown"
        closing: "unknown"
      confidence: "low"
      note: "Too little mined evidence; measure with the profiler."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "From 4.33, lia is a stronger sibling; omega stays stable across 4.25-4.33."
    move_class: "omega_replaces"
    source: "both"
  -
    id: "S12-nonlinear-to-omega-or-positivity"
    title: "Swap linarith/nlinarith for a cheaper decision tactic"
    tags:
      - "linarith"
      - "nlinarith"
      - "positivity"
    goal_tags: []
    at: {}
    when: "linarith or nlinarith on a goal that is linear over ℕ/ℤ, or a positivity/monotonicity claim."
    how: "Use omega for linear integer goals; positivity for 0 < / 0 ≤ of products, sums, powers; gcongr for monotone shapes."
    before: "example (x y : ℤ) (h : 0 ≤ x) (h' : 0 ≤ y) : 0 ≤ x + 2 * y := by linarith"
    after: "example (x y : ℤ) (h : 0 ≤ x) (h' : 0 ≤ y) : 0 ≤ x + 2 * y := by omega"
    effect:
      tokens: "unknown"
      heartbeats:
        opening: "unknown"
        middle: "unknown"
        closing: "unknown"
      confidence: "low"
      note: "Too little mined evidence; measure with the profiler."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Stable across 4.25-4.33 as far as known."
    move_class: "linarith_to_omega"
    source: "both"
  -
    id: "S13-aesop-to-script"
    title: "Replace aesop by its explicit script"
    tags:
      - "aesop"
      - "heartbeats"
    goal_tags: []
    at: {}
    when: "aesop closes a goal but is slow or its search is opaque."
    how: "Use aesop? and paste the Try this script, then shorten with simp_all or exact."
    before: "example (p q : Prop) (hp : p) (hq : q) : p ∧ q := by aesop"
    after: "example (p q : Prop) (hp : p) (hq : q) : p ∧ q := ⟨hp, hq⟩"
    effect:
      tokens: "unknown"
      heartbeats:
        opening: "unknown"
        middle: "unknown"
        closing: "unknown"
      confidence: "low"
      note: "Too little mined evidence; measure with the profiler."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Stable across 4.25-4.33 as far as known."
    move_class: "aesop_replaced"
    source: "both"
  -
    id: "S14-rw-merge"
    title: "Merge consecutive rewrites"
    tags:
      - "rw"
    goal_tags: []
    at: {}
    when: "Several rw lines in a row on the same goal or hypothesis."
    how: "One rw [a, b, c]. Add at h ⊢ to hit several locations at once."
    before: |-
      example (a b : ℕ) (h1 : a = b) (h2 : b = 3) : a + 0 = 3 := by
        rw [Nat.add_zero]
        rw [h1]
        rw [h2]
    after: |-
      example (a b : ℕ) (h1 : a = b) (h2 : b = 3) : a + 0 = 3 := by
        rw [Nat.add_zero, h1, h2]
    effect:
      tokens: "down"
      heartbeats:
        opening: "unknown"
        middle: "down"
        closing: "mixed"
      confidence: "high"
      note: "Heartbeat effect depends on where in the proof the edit sits; profile before deciding."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Stable across 4.25-4.33 as far as known."
    move_class: "rw_chain_merge"
    source: "both"
  -
    id: "S15-rw-to-simp-only"
    title: "Use simp only when rw hits motive trouble or repeated patterns"
    tags:
      - "rw"
      - "simp only"
      - "binders"
    goal_tags: []
    at: {}
    when: "A rw chain repeats one rewrite across many occurrences, or needs conv / nth_rewrite."
    how: "simp only [lemma] rewrites all instances and goes under binders."
    before: |-
      example (f : ℕ → ℕ) (h : ∀ x, f x = x) : f 1 + f 2 = 3 := by
        rw [h 1, h 2]
    after: |-
      example (f : ℕ → ℕ) (h : ∀ x, f x = x) : f 1 + f 2 = 3 := by
        simp only [h]
    effect:
      tokens: "mixed"
      heartbeats:
        opening: "unknown"
        middle: "down"
        closing: "down"
      confidence: "medium"
      note: "Heartbeat direction is the same at every position with data."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "rw is cheaper than simp when it works; use this only when rw fails or needs several lines."
    move_class: "rw_to_simp_only"
    source: "both"
  -
    id: "S16-rw-to-transport"
    title: "Replace rw+exact by a term (▸ or Eq.mp)"
    tags:
      - "rw"
      - "transport"
    goal_tags: []
    at: {}
    when: "rw [h]; exact t where the rewrite only changes the goal's type."
    how: "h ▸ t, or (h ▸ t : T). Test the motive; if it fails, use rwa [h]."
    before: |-
      example (a b : ℕ) (h : a = b) (p : ℕ → Prop) (ha : p a) : p b := by
        rw [← h]
        exact ha
    after: "example (a b : ℕ) (h : a = b) (p : ℕ → Prop) (ha : p a) : p b := h ▸ ha"
    effect:
      tokens: "down"
      heartbeats:
        opening: "unknown"
        middle: "down"
        closing: "mixed"
      confidence: "medium"
      note: "Heartbeat effect depends on where in the proof the edit sits; profile before deciding."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Stable across 4.25-4.33 as far as known."
    move_class: "rw_to_term"
    source: "both"
  -
    id: "S17-rwa-simpa"
    title: "Fuse rewrite/simp with the closing assumption"
    tags:
      - "rwa"
      - "simpa"
    goal_tags: []
    at: {}
    when: "rw/simp at h followed by exact h, or rw then assumption."
    how: "rwa [..] at h, or simpa [..] using h."
    before: |-
      example (a b : ℕ) (h : a + 0 = b) : a = b := by
        rw [Nat.add_zero] at h
        exact h
    after: |-
      example (a b : ℕ) (h : a + 0 = b) : a = b := by
        simpa using h
    effect:
      tokens: "mixed"
      heartbeats:
        opening: "unknown"
        middle: "down"
        closing: "down"
      confidence: "medium"
      note: "Heartbeat direction is the same at every position with data."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "simpa is brittle if a linter-fired simp set changes; rwa is stable."
    move_class: "rwa_simpa"
    source: "both"
  -
    id: "S18-intro-to-fun"
    title: "Turn intro + exact into a lambda"
    tags:
      - "intro"
      - "fun"
    goal_tags: []
    at: {}
    when: "Goal is ∀ / → and the proof is intro x y followed by one exact."
    how: "Write fun x y => term, or fun ⟨a, b⟩ => .. for patterns."
    before: |-
      example (p q : Prop) : p → q → p := by
        intro hp _
        exact hp
    after: "example (p q : Prop) : p → q → p := fun hp _ => hp"
    effect:
