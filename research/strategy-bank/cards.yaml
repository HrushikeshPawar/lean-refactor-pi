  -
    id: "S19-constructor-to-anonymous"
    title: "constructor/refine ⟨?_, ?_⟩ + exacts -> anonymous constructor"
    tags:
      - "constructor"
      - "anonymous-constructor"
    goal_tags: []
    at: {}
    when: "Goal is a structure, ∧, ↔ or ∃ and every field has a one-line proof."
    how: "⟨a, b⟩ in term mode; (by tac) per field if needed. For ↔ use ⟨fun h => .., fun h => ..⟩."
    before: |-
      example (p q : Prop) (hp : p) (hq : q) : p ∧ q := by
        constructor
        · exact hp
        · exact hq
    after: "example (p q : Prop) (hp : p) (hq : q) : p ∧ q := ⟨hp, hq⟩"
    effect:
      tokens: "mixed"
      heartbeats:
        opening: "unknown"
        middle: "down"
        closing: "down"
      confidence: "medium"
      note: "Heartbeat direction is the same at every position with data."
    verified:
      v4.27.0: "pass"
      v4.26.0: "pass"
      v4.25.0: "pass"
    version_notes: "Stable across 4.25-4.33 as far as known."
    move_class: "constructor_to_anon"
    source: "both"
  -
    id: "S20-bullets-to-combinators"
    title: "Replace parallel bullets with <;>, all_goals or exacts"
    tags:
      - "bullets"
      - "<;>"
      - "all_goals"
      - "exacts"
    goal_tags: []
    at: {}
    when: "Several sibling goals are closed by the same tactic or by one-line exacts."
    how: "t <;> s runs s on every goal from t; exacts [a, b]; all_goals s for leftover goals."
    before: |-
      example (p q : Prop) (hp : p) (hq : q) : (p ∧ q) ∧ (q ∧ p) := by
        refine ⟨⟨?_, ?_⟩, ⟨?_, ?_⟩⟩
        · exact hp
        · exact hq
        · exact hq
        · exact hp
    after: |-
      example (p q : Prop) (hp : p) (hq : q) : (p ∧ q) ∧ (q ∧ p) := by
        refine ⟨⟨?_, ?_⟩, ⟨?_, ?_⟩⟩ <;> assumption
    effect:
      tokens: "unknown"
      heartbeats:
        opening: "unknown"
        middle: "unknown"
        closing: "unknown"
      confidence: "low"
      note: "Too little mined evidence; measure with the profiler."
    verified:
      v4.27.0: "pass"
