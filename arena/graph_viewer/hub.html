<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena runs</title>
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <header>
    <h1>Arena runs</h1><div id="hub-sub" class="sub">Connecting…</div>
    <div id="strip" class="strip"></div>
    <div id="hub-live" class="live">Connecting…</div>
  </header>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Open runs"></nav>
  <main id="panels">
    <section id="panel-overview" class="panel-overview" role="tabpanel" aria-label="Runs">
      <div class="filters">
        <input id="f-text" type="search" placeholder="Search run, theorem, model…" aria-label="Search runs">
        <select id="f-theorem" aria-label="Theorem"></select>
        <select id="f-model" aria-label="Model"></select>
        <select id="f-campaign" aria-label="Campaign"></select>
        <select id="f-status" aria-label="Status"><option value="">any status</option><option value="live">live</option><option value="finished">finished</option><option value="stalled">stalled</option></select>
        <label class="check"><input id="f-group" type="checkbox"> group by campaign</label>
        <button id="f-reset" type="button">Reset</button>
        <span id="f-count" class="muted"></span>
        <span class="muted legend-note">Click a header to sort, a row to open its dashboard in a tab; hover a row for more. Δ is against the original proof (proxy 33.33).</span>
      </div>
      <table class="overview" id="runs-table">
        <thead id="thead"></thead>
        <tbody id="overview-rows"><tr><td colspan="9" class="muted">No runs yet.</td></tr></tbody>
      </table>
    </section>
  </main>
  <div id="rowtip" class="rowtip" hidden></div>
  <script src="hub.js" defer></script>
</body>
</html>
